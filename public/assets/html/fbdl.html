<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Facebook Downloader - No Watermark</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style/ttdl.css"/>
</head>
<body>
<div class="overlay"></div>

<div class="container">
  <h1>Facebook Downloader</h1>
  <input type="text" id="fb-url" placeholder="Masukkan link Facebook">
  <button id="load-btn">Download</button>

  <select id="video-select">
    <option value="HD">HD       (  MP4  -  1080p  )</option>
    <option value="SD">SD       (  MP4  -   480p  )</option>
    <option value="Audio">Audio  (  MP3  -  128kbps  )</option>
    <option value="Photo">Photo</option>
  </select>

  <div class="preview-container">
    <img id="preview-image" alt="Preview Image">
    <video id="preview-video" controls></video>
    <audio id="preview-audio" controls></audio>
  </div>
  <h2 id="preview-title"></h2>

  <div id="error-msg" class="error">Gagal memuat data. Periksa URL.</div>
  <div class="created-by">Created By ILHAM A.</div>
</div>

<!-- Loading screen -->
<div id="loading-screen"><div class="loader"></div></div>

<script src="/script/fbdl.js"></script>
</body>
</html>
