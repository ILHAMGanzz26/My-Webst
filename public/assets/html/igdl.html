<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Instagram Downloader - Reels</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style/igdl.css" />
</head>
<body>

<img id="bg-gif" class="bg-media" src="https://c.top4top.io/p_35367lynf0.gif" style="display:none;">
<video id="bg-video" class="bg-media" autoplay muted loop playsinline style="display:none;">
  <source src="https://cdn.coverr.co/videos/coverr-flowing-purple-smoke-4455/1080p.mp4" type="video/mp4">
</video>
<div class="overlay"></div>

<div class="container">
  <h1>Instagram Downloader</h1>
  <input type="text" id="capcut-url" placeholder="Masukkan link Instagram Reels">
  <button id="load-btn">Download</button>

  <div id="video-info" style="display:none;">
    <video id="video-preview" controls playsinline></video>
    <h2 id="caption"></h2>
  </div>

  <div id="error-msg" class="error">Gagal memuat data. Periksa URL.</div>
  <div class="created-by">Created By ILHAM A.</div>
</div>

<script src="/script/igdl.js"></script>
</body>
</html>
